<svg viewBox="0 0 860 500" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#161b27"/>
    </linearGradient>
    <linearGradient id="sync"   x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a1d96"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="util"   x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#475569"/>
    </marker>
    <marker id="arr-b" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#60a5fa"/>
    </marker>
    <marker id="arr-p" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#a78bfa"/>
    </marker>
    <marker id="arr-g" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="860" height="500" fill="url(#bg)" rx="12"/>
  <rect width="860" height="500" fill="none" stroke="#1e293b" stroke-width="1" rx="12"/>

  <text x="430" y="36" text-anchor="middle" fill="#94a3b8" font-size="13" letter-spacing="3">API ENDPOINTS OVERVIEW</text>

  <!-- ══ CLIENT box ══ -->
  <rect x="20" y="60" width="100" height="380" rx="8" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
  <text x="70" y="250" text-anchor="middle" fill="#475569" font-size="10" transform="rotate(-90,70,250)" letter-spacing="2">CLIENT</text>

  <!-- ══ ENDPOINT CARDS ══ -->

  <!-- /health -->
  <rect x="150" y="65" width="480" height="50" rx="6" fill="url(#util)"/>
  <text x="165" y="83" fill="#a7f3d0" font-size="11" font-weight="bold">GET /health</text>
  <text x="165" y="99" fill="#6ee7b7" font-size="9">Check server status + export directory path</text>
  <rect x="630" y="74" width="60" height="22" rx="3" fill="#065f46" stroke="#34d399" stroke-width="1"/>
  <text x="660" y="89" text-anchor="middle" fill="#34d399" font-size="9">utility</text>
  <line x1="120" y1="90" x2="150" y2="90" stroke="#34d399" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- /tree_verbose -->
  <rect x="150" y="130" width="480" height="60" rx="6" fill="url(#sync)"/>
  <text x="165" y="150" fill="#bfdbfe" font-size="11" font-weight="bold">GET /tree_verbose</text>
  <text x="165" y="167" fill="#93c5fd" font-size="9">Traverse EIA tree from root → list of leaf routes with metadata</text>
  <text x="165" y="181" fill="#60a5fa" font-size="8">params: root, max_depth, max_leaf_routes</text>
  <rect x="630" y="144" width="60" height="22" rx="3" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1"/>
  <text x="660" y="159" text-anchor="middle" fill="#60a5fa" font-size="9">sync</text>
  <line x1="120" y1="160" x2="150" y2="160" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- /curl_commands -->
  <rect x="150" y="205" width="480" height="60" rx="6" fill="url(#sync)"/>
  <text x="165" y="225" fill="#bfdbfe" font-size="11" font-weight="bold">GET /curl_commands</text>
  <text x="165" y="242" fill="#93c5fd" font-size="9">Generate ready-to-run curl commands for bulk export</text>
  <text x="165" y="256" fill="#60a5fa" font-size="8">params: root, frequencies, resume, file_size…</text>
  <rect x="630" y="219" width="60" height="22" rx="3" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1"/>
  <text x="660" y="234" text-anchor="middle" fill="#60a5fa" font-size="9">sync</text>
  <line x1="120" y1="235" x2="150" y2="235" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- /export_status -->
  <rect x="150" y="280" width="480" height="60" rx="6" fill="url(#sync)"/>
  <text x="165" y="300" fill="#bfdbfe" font-size="11" font-weight="bold">GET /export_status</text>
  <text x="165" y="317" fill="#93c5fd" font-size="9">Check rows written, last file, checkpoint state for a route</text>
  <text x="165" y="331" fill="#60a5fa" font-size="8">params: route, frequency, file_size</text>
  <rect x="630" y="294" width="60" height="22" rx="3" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1"/>
  <text x="660" y="309" text-anchor="middle" fill="#60a5fa" font-size="9">sync</text>
  <line x1="120" y1="310" x2="150" y2="310" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- /export_route_all_split10k -->
  <rect x="150" y="355" width="480" height="60" rx="6" fill="url(#sync)" opacity="0.85"/>
  <text x="165" y="375" fill="#bfdbfe" font-size="11" font-weight="bold">GET /export_route_all_split10k</text>
  <text x="165" y="392" fill="#93c5fd" font-size="9">One-shot blocking export → returns final JSON summary</text>
  <text x="165" y="406" fill="#60a5fa" font-size="8">params: route, frequency, start, end, verify…</text>
  <rect x="630" y="368" width="80" height="22" rx="3" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1"/>
  <text x="670" y="383" text-anchor="middle" fill="#60a5fa" font-size="9">sync · blocks</text>
  <line x1="120" y1="385" x2="150" y2="385" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- /export_route_all_split10k_stream -->
  <rect x="150" y="428" width="480" height="50" rx="6" fill="url(#stream)"/>
  <text x="165" y="448" fill="#ddd6fe" font-size="11" font-weight="bold">GET /export_route_all_split10k_stream</text>
  <text x="165" y="465" fill="#c4b5fd" font-size="9">Streaming export with real-time logs · supports resume + start_offset</text>
  <rect x="630" y="442" width="80" height="22" rx="3" fill="#4a1d96" stroke="#a78bfa" stroke-width="1"/>
  <text x="670" y="457" text-anchor="middle" fill="#a78bfa" font-size="9">streaming</text>
  <line x1="120" y1="453" x2="150" y2="453" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- ══ WORKFLOW STEPS (right column) ══ -->
  <rect x="720" y="130" width="120" height="350" rx="8" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
  <text x="780" y="152" text-anchor="middle" fill="#475569" font-size="9" letter-spacing="2">WORKFLOW</text>

  <circle cx="780" cy="175" r="12" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="780" y="179" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="bold">1</text>
  <text x="780" y="198" text-anchor="middle" fill="#93c5fd" font-size="8">tree_verbose</text>
  <text x="780" y="210" text-anchor="middle" fill="#64748b" font-size="7">discover routes</text>

  <line x1="780" y1="222" x2="780" y2="240" stroke="#334155" stroke-width="1"/>

  <circle cx="780" cy="252" r="12" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="780" y="256" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="bold">2</text>
  <text x="780" y="275" text-anchor="middle" fill="#93c5fd" font-size="8">curl_commands</text>
  <text x="780" y="287" text-anchor="middle" fill="#64748b" font-size="7">generate scripts</text>

  <line x1="780" y1="299" x2="780" y2="317" stroke="#334155" stroke-width="1"/>

  <circle cx="780" cy="329" r="12" fill="#4a1d96" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="780" y="333" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="bold">3</text>
  <text x="780" y="352" text-anchor="middle" fill="#c4b5fd" font-size="8">…_stream</text>
  <text x="780" y="364" text-anchor="middle" fill="#64748b" font-size="7">run export</text>

  <line x1="780" y1="376" x2="780" y2="394" stroke="#334155" stroke-width="1"/>

  <circle cx="780" cy="406" r="12" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="780" y="410" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="bold">4</text>
  <text x="780" y="429" text-anchor="middle" fill="#93c5fd" font-size="8">export_status</text>
  <text x="780" y="441" text-anchor="middle" fill="#64748b" font-size="7">verify result</text>
</svg>
