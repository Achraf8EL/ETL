<svg viewBox="0 0 860 480" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#161b27"/>
    </linearGradient>
    <linearGradient id="leaf-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="node-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#475569"/>
    </marker>
    <marker id="arr-g" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="860" height="480" fill="url(#bg)" rx="12"/>
  <rect width="860" height="480" fill="none" stroke="#1e293b" stroke-width="1" rx="12"/>

  <text x="430" y="36" text-anchor="middle" fill="#94a3b8" font-size="13" letter-spacing="3">EIA TREE TRAVERSAL — ITERATIVE DFS</text>

  <!-- ═══ LEFT: Tree diagram ═══ -->

  <!-- root -->
  <rect x="30" y="60" width="120" height="40" rx="6" fill="url(#node-grad)"/>
  <text x="90" y="84" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="bold">petroleum</text>

  <!-- L1 branches -->
  <line x1="90" y1="100" x2="90" y2="124" stroke="#334155" stroke-width="1.5"/>
  <line x1="90" y1="124" x2="60" y2="124" stroke="#334155" stroke-width="1.5"/>
  <line x1="90" y1="124" x2="200" y2="124" stroke="#334155" stroke-width="1.5"/>

  <!-- sum -->
  <line x1="60" y1="124" x2="60" y2="140" stroke="#334155" stroke-width="1.5"/>
  <rect x="20" y="140" width="80" height="36" rx="6" fill="url(#node-grad)"/>
  <text x="60" y="162" text-anchor="middle" fill="#93c5fd" font-size="11">sum</text>

  <!-- pri -->
  <line x1="200" y1="124" x2="200" y2="140" stroke="#334155" stroke-width="1.5"/>
  <rect x="160" y="140" width="80" height="36" rx="6" fill="url(#node-grad)"/>
  <text x="200" y="162" text-anchor="middle" fill="#93c5fd" font-size="11">pri</text>

  <!-- sum children -->
  <line x1="60" y1="176" x2="60" y2="200" stroke="#334155" stroke-width="1.5"/>
  <line x1="60" y1="200" x2="35" y2="200" stroke="#334155" stroke-width="1.5"/>
  <line x1="60" y1="200" x2="85" y2="200" stroke="#334155" stroke-width="1.5"/>

  <line x1="35" y1="200" x2="35" y2="216" stroke="#334155" stroke-width="1.5"/>
  <rect x="5" y="216" width="60" height="36" rx="6" fill="url(#leaf-grad)"/>
  <text x="35" y="234" text-anchor="middle" fill="#a7f3d0" font-size="10" font-weight="bold">mkt ✓</text>
  <text x="35" y="246" text-anchor="middle" fill="#6ee7b7" font-size="8">leaf</text>

  <line x1="85" y1="200" x2="85" y2="216" stroke="#334155" stroke-width="1.5"/>
  <rect x="55" y="216" width="60" height="36" rx="6" fill="url(#leaf-grad)"/>
  <text x="85" y="234" text-anchor="middle" fill="#a7f3d0" font-size="10" font-weight="bold">snd ✓</text>
  <text x="85" y="246" text-anchor="middle" fill="#6ee7b7" font-size="8">leaf</text>

  <!-- pri children -->
  <line x1="200" y1="176" x2="200" y2="200" stroke="#334155" stroke-width="1.5"/>
  <line x1="200" y1="200" x2="170" y2="200" stroke="#334155" stroke-width="1.5"/>
  <line x1="200" y1="200" x2="230" y2="200" stroke="#334155" stroke-width="1.5"/>

  <line x1="170" y1="200" x2="170" y2="216" stroke="#334155" stroke-width="1.5"/>
  <rect x="135" y="216" width="70" height="36" rx="6" fill="url(#leaf-grad)"/>
  <text x="170" y="234" text-anchor="middle" fill="#a7f3d0" font-size="10" font-weight="bold">allmg ✓</text>
  <text x="170" y="246" text-anchor="middle" fill="#6ee7b7" font-size="8">leaf</text>

  <line x1="230" y1="200" x2="230" y2="216" stroke="#334155" stroke-width="1.5"/>
  <rect x="195" y="216" width="70" height="36" rx="6" fill="url(#leaf-grad)"/>
  <text x="230" y="234" text-anchor="middle" fill="#a7f3d0" font-size="10" font-weight="bold">wpsup ✓</text>
  <text x="230" y="246" text-anchor="middle" fill="#6ee7b7" font-size="8">leaf</text>

  <!-- natural-gas -->
  <rect x="280" y="60" width="120" height="40" rx="6" fill="url(#node-grad)"/>
  <text x="340" y="84" text-anchor="middle" fill="#bfdbfe" font-size="11" font-weight="bold">natural-gas</text>
  <line x1="340" y1="100" x2="340" y2="120" stroke="#334155" stroke-width="1.5"/>
  <text x="340" y="136" text-anchor="middle" fill="#475569" font-size="10">…</text>

  <!-- legend left -->
  <rect x="20" y="275" width="260" height="70" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="150" y="294" text-anchor="middle" fill="#64748b" font-size="10" letter-spacing="2">LEGEND</text>
  <rect x="35" y="302" width="14" height="14" rx="3" fill="url(#node-grad)"/>
  <text x="56" y="313" fill="#94a3b8" font-size="10">intermediate node (has children)</text>
  <rect x="35" y="322" width="14" height="14" rx="3" fill="url(#leaf-grad)"/>
  <text x="56" y="333" fill="#94a3b8" font-size="10">leaf node ✓ (exposes data rows)</text>

  <!-- ═══ RIGHT: Algorithm + is_leaf condition ═══ -->

  <rect x="420" y="55" width="410" height="290" rx="8" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
  <text x="625" y="80" text-anchor="middle" fill="#64748b" font-size="10" letter-spacing="2">ALGORITHM</text>

  <!-- stack -->
  <text x="440" y="105" fill="#475569" font-size="10">stack = [(root, depth=0)]</text>
  <text x="440" y="122" fill="#475569" font-size="10">seen  = set()</text>
  <text x="440" y="139" fill="#475569" font-size="10">leafs = []</text>

  <text x="440" y="165" fill="#64748b" font-size="10">while stack:</text>
  <text x="460" y="182" fill="#64748b" font-size="10">path, depth = stack.pop()</text>
  <text x="460" y="199" fill="#64748b" font-size="10">if path in seen: continue</text>
  <text x="460" y="216" fill="#64748b" font-size="10">seen.add(path)</text>

  <text x="460" y="238" fill="#34d399" font-size="10">if is_leaf(md):</text>
  <text x="480" y="255" fill="#34d399" font-size="10">leafs.append(path)  ← collect</text>
  <text x="480" y="272" fill="#34d399" font-size="10">continue</text>

  <text x="460" y="294" fill="#fbbf24" font-size="10">if depth &lt; max_depth:</text>
  <text x="480" y="311" fill="#fbbf24" font-size="10">for child in get_routes(md):</text>
  <text x="500" y="328" fill="#fbbf24" font-size="10">stack.append((child, depth+1))</text>

  <!-- is_leaf box -->
  <rect x="420" y="365" width="410" height="90" rx="8" fill="#0d1424" stroke="#1e293b" stroke-width="1"/>
  <text x="625" y="386" text-anchor="middle" fill="#64748b" font-size="10" letter-spacing="2">is_leaf() — THREE CONDITIONS</text>

  <rect x="435" y="396" width="110" height="44" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="490" y="414" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">has_frequency</text>
  <text x="490" y="430" text-anchor="middle" fill="#64748b" font-size="9">list len &gt; 0</text>

  <text x="563" y="422" text-anchor="middle" fill="#475569" font-size="14">AND</text>

  <rect x="583" y="396" width="110" height="44" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="638" y="414" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="bold">has_data_fields</text>
  <text x="638" y="430" text-anchor="middle" fill="#64748b" font-size="9">data is dict</text>

  <text x="711" y="422" text-anchor="middle" fill="#475569" font-size="14">AND</text>

  <rect x="731" y="396" width="85" height="44" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="773" y="414" text-anchor="middle" fill="#f87171" font-size="10" font-weight="bold">NOT</text>
  <text x="773" y="428" text-anchor="middle" fill="#f87171" font-size="10">has_children</text>

  <!-- arrow from condition to leafs -->
  <line x1="490" y1="440" x2="490" y2="460" stroke="#34d399" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="500" y="472" fill="#34d399" font-size="9">→ append to leafs[]</text>
</svg>
